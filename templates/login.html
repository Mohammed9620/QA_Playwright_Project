<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — QA Automation Engine</title>
  <meta name="description" content="Sign in to the QA Automation Engine dashboard.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ════════════════════════════════════════════════════════════
       RESET & DESIGN TOKENS  (mirrors index.html palette exactly)
       ════════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root,
    [data-theme="dark"] {
      --bg-primary:     #0d0814;
      --bg-secondary:   #120b1c;
      --bg-tertiary:    #181023;
      --bg-elevated:    #20152c;
      --border-default: #32243f;
      --border-muted:   #24192f;
      --text-primary:   #f2edf5;
      --text-secondary: #a79cae;
      --text-tertiary:  #75697f;
      --accent-blue:    #9b6ac4;
      --success:        #22c55e;
      --success-muted:  rgba(34,197,94,0.15);
      --danger:         #ef4444;
      --danger-muted:   rgba(239,68,68,0.15);
      --font:           'Inter', system-ui, -apple-system, sans-serif;
      --mono:           'JetBrains Mono', 'Fira Code', monospace;
      --radius:         0.625rem;
      --radius-sm:      calc(var(--radius) * 0.6);
      --transition:     0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --glass-bg:       rgba(16,10,24,0.88);
      color-scheme: dark;
    }

    [data-theme="light"] {
      --bg-primary:     #faf8fc;
      --bg-secondary:   #ffffff;
      --bg-tertiary:    #f1ebf5;
      --bg-elevated:    #e7ddec;
      --border-default: #d9cde0;
      --border-muted:   #eee7f2;
      --text-primary:   #211629;
      --text-secondary: #5f5268;
      --text-tertiary:  #7d6f86;
      --accent-blue:    #74479b;
      --success:        #16a34a;
      --success-muted:  rgba(22,163,74,0.1);
      --danger:         #dc2626;
      --danger-muted:   rgba(220,38,38,0.1);
      --glass-bg:       rgba(250,248,252,0.88);
      color-scheme: light;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--font);
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      font-size: 14px;
      line-height: 1.5;
      transition: background var(--transition), color var(--transition);
    }

    /* ════════════════════════════════════════════════════════════
       TOP BAR  (identical to index.html topbar)
       ════════════════════════════════════════════════════════════ */
    .topbar {
      height: 48px;
      min-height: 48px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-default);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 100;
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-primary);
      text-decoration: none;
    }
    .topbar-brand svg { flex-shrink: 0; }
    .topbar-version {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-tertiary);
      background: var(--bg-tertiary);
      border: 1px solid var(--border-default);
      padding: 1px 6px;
      border-radius: 10px;
      letter-spacing: 0.02em;
    }
    .topbar-spacer { flex: 1; }
    .theme-toggle {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-default);
      color: var(--text-secondary);
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: all var(--transition);
      padding: 0;
      line-height: 1;
    }
    .theme-toggle:hover {
      color: var(--text-primary);
      border-color: var(--text-tertiary);
      background: var(--bg-elevated);
    }

    /* ════════════════════════════════════════════════════════════
       LOGIN CARD LAYOUT
       ════════════════════════════════════════════════════════════ */
    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
    }

    /* ── Brand mark above card ── */
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
      text-align: center;
    }
    .login-brand-icon {
      width: 40px;
      height: 40px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-blue);
    }
    .login-brand-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }
    .login-brand-sub {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* ── Card surface ── */
    .login-surface {
      background: var(--bg-secondary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius);
      padding: 28px 24px;
    }

    /* ── Section header inside card ── */
    .login-section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 20px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-default);
    }
    /* Segmented Tab Controls */
    .tabs-container {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
        justify-content: center;
    }
    .tab-btn {
        padding: 10px 20px;
        border: 1px solid var(--border-default, #333);
        background-color: transparent;
        color: var(--text-tertiary);
        cursor: pointer;
        border-radius: 6px;
        transition: all 0.3s ease;
        font-size: 14px;
        font-weight: 500;
    }
    .tab-btn.active {
        background-color: var(--accent-blue) !important;
        color: #ffffff !important;
        border-color: var(--accent-blue) !important;
        font-weight: 600;
    }
    .form-group {
        margin-bottom: 18px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .form-group input {
        padding: 12px;
        border: 1px solid var(--border-default, #333);
        background-color: var(--bg-primary);
        color: var(--text-primary);
        border-radius: 6px;
        width: 100%;
        font-size: 14px;
    }
    .form-group label {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-primary);
    }

    /* ── Error banner ── */
    .error-banner {
      display: none;
      align-items: flex-start;
      gap: 8px;
      background: var(--danger-muted);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 20px;
      font-size: 13px;
      color: var(--danger);
      line-height: 1.4;
    }
    .error-banner.visible { display: flex; }
    .error-banner svg { flex-shrink: 0; margin-top: 1px; }

    /* ── Submit button ── */
    .btn-login {
      width: 100%;
      margin-top: 24px;
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: var(--accent-blue);
      color: #ffffff;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: filter var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login:hover { filter: brightness(1.12); }
    .btn-login:active { filter: brightness(0.95); }

    /* ── Back link ── */
    .login-back {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--text-tertiary);
    }
    .login-back a {
      color: var(--accent-blue);
      text-decoration: none;
    }
    .login-back a:hover { text-decoration: underline; }

    /* ════════════════════════════════════════════════════════════
       FOOTER STATUS BAR
       ════════════════════════════════════════════════════════════ */
    .footer-bar {
      height: 28px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-default);
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 11px;
      color: var(--text-tertiary);
      gap: 12px;
    }
    .footer-spacer { flex: 1; }

    /* Outer translates in viewport coordinates; inner owns sprite direction. */
    .login-mascot {
      position: fixed;
      left: 0;
      bottom: 28px;
      width: 100px;
      height: 100px;
      display: block;
      pointer-events: none;
      user-select: none;
      z-index: 2;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }
    .login-mascot-sprite,
    .login-mascot-front {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .login-mascot-sprite {
      overflow: hidden;
      transform-origin: center bottom;
      will-change: transform;
      background-image: url("{{ url_for('static', filename='images/login-mascot-walk-v2-normalized.png') }}");
      background-repeat: no-repeat;
      background-size: 400% 300%;
      background-position: 0 0;
      image-rendering: pixelated;
    }
    .login-mascot-front {
      display: block;
      object-fit: contain;
      object-position: center bottom;
      visibility: hidden;
      image-rendering: pixelated;
    }
    .login-mascot[data-visual="front"] .login-mascot-sprite { visibility: hidden; }
    .login-mascot[data-visual="front"] .login-mascot-front { visibility: visible; }
    .mascot-greeting-cloud {
      position: absolute;
      left: 50%;
      bottom: calc(100% - 8px);
      width: max-content;
      max-width: 150px;
      padding: 8px 12px;
      border: 1px solid var(--border-default);
      border-radius: 18px 20px 16px 21px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.35;
      text-align: center;
      white-space: nowrap;
      opacity: 0;
      transform: translateX(-50%) scale(0.94);
      transition: opacity 140ms ease-out, transform 160ms ease-out;
      pointer-events: none;
    }
    .mascot-greeting-cloud::before,
    .mascot-greeting-cloud::after {
      content: "";
      position: absolute;
      z-index: -1;
      border: 1px solid var(--border-default);
      border-radius: 50%;
      background: var(--bg-secondary);
    }
    .mascot-greeting-cloud::before { width: 16px; height: 16px; left: 15px; top: -6px; }
    .mascot-greeting-cloud::after { width: 21px; height: 21px; right: 18px; top: -8px; }
    .login-mascot[data-greeting="true"] .mascot-greeting-cloud {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }
    .login-mascot[data-cloud-align="left"] .mascot-greeting-cloud {
      left: 0;
      transform: scale(0.94);
    }
    .login-mascot[data-cloud-align="right"] .mascot-greeting-cloud {
      right: 0;
      left: auto;
      transform: scale(0.94);
    }
    .login-mascot[data-greeting="true"][data-cloud-align="left"] .mascot-greeting-cloud,
    .login-mascot[data-greeting="true"][data-cloud-align="right"] .mascot-greeting-cloud {
      transform: scale(1);
    }
    @media (hover: hover) and (pointer: fine) {
      .login-mascot { pointer-events: auto; }
    }
    @media (max-width: 600px) {
      .login-mascot {
        width: 76px;
        height: 76px;
      }
    }
    @media (max-width: 340px), (max-height: 620px) {
      .login-mascot { display: none; }
    }

    /* ════════════════════════════════════════════════════════════
       SCROLLBAR
       ════════════════════════════════════════════════════════════ */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border-default);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

    /* Interaction polish: visual feedback only; actions remain immediate. */
    .theme-toggle, .tab-btn, .btn-login {
      transition: background-color 180ms ease-out, border-color 180ms ease-out,
                  color 180ms ease-out, opacity 180ms ease-out,
                  box-shadow 180ms ease-out, filter 180ms ease-out,
                  transform 160ms ease-out;
    }
    .tab-btn:hover:not(.active) { background-color: var(--bg-tertiary); color: var(--text-secondary); border-color: var(--text-tertiary); }
    .theme-toggle:active, .tab-btn:active, .btn-login:active { transform: translateY(1px); }
    .theme-toggle:focus-visible, .tab-btn:focus-visible, .btn-login:focus-visible {
      outline: 2px solid var(--accent-blue); outline-offset: 2px;
    }
    .btn-login:disabled { cursor: not-allowed; opacity: .58; filter: saturate(.72); }
    .topbar-brand, .login-back a { transition: color 180ms ease-out, opacity 180ms ease-out; }
    .topbar-brand:active, .login-back a:active { opacity: .72; }
    @media (prefers-reduced-motion: reduce) {
      .theme-toggle, .tab-btn, .btn-login { transition-duration: 160ms; }
      .mascot-greeting-cloud { transition-duration: 100ms; }
      .theme-toggle:active, .tab-btn:active, .btn-login:active { transform: none; filter: brightness(.94); }
    }
  </style>
</head>

<body>
  <!-- ════════ TOP BAR ════════ -->
  <header class="topbar">
    <a class="topbar-brand" href="/">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
      QA Automation Engine
    </a>
    <span class="topbar-version">v1.0</span>
    <div class="topbar-spacer"></div>
    <button class="theme-toggle" id="theme-toggle" title="Toggle theme" aria-label="Toggle dark/light theme">
      <span id="theme-icon">☀️</span>
    </button>
  </header>

  <!-- ════════ LOGIN CARD ════════ -->
  <main class="login-wrapper">
    <div class="login-card">

      <!-- Brand mark -->
      <div class="login-brand">
        <div class="login-brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
        </div>
        <span class="login-brand-title">Sign in</span>
        <span class="login-brand-sub">Access the QA Automation Engine</span>
      </div>

      <!-- Card surface -->
      <div class="login-surface">
        <!-- Role Tabs -->
        <div class="tabs-container">
          <button type="button" class="tab-btn active" id="user-tab">Login as User</button>
          <button type="button" class="tab-btn" id="admin-tab">Login as Admin</button>
        </div>

        <div class="login-section-title" id="form-section-title">Credentials</div>

        <!-- Error banner: shown by server on bad credentials OR by JS for empty fields -->
        {% if error %}
        <div class="error-banner visible" id="login-error" role="alert">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span id="login-error-text">{{ error }}</span>
        </div>
        {% else %}
        <div class="error-banner" id="login-error" role="alert">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span id="login-error-text">Invalid username or password.</span>
        </div>
        {% endif %}

        <form id="login-form" method="POST" action="/login" novalidate>
          <input type="hidden" name="role" id="role-hidden-input" value="user">

          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Username or Email"
              autocomplete="username"
              spellcheck="false"
              required
            >
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            >
          </div>

          <button type="submit" class="btn-login" id="login-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            Sign in
          </button>
        </form>
      </div>

      <p class="login-back">
        Don't have an account? <a href="/signup">Sign up</a>
      </p>
    </div>
  </main>

  <div class="login-mascot" id="login-mascot" aria-hidden="true" data-greeting="false" data-visual="front">
    <div class="login-mascot-sprite" id="login-mascot-sprite"></div>
    <img class="login-mascot-front" id="login-mascot-front" src="{{ url_for('static', filename='images/login-mascot.png') }}" alt="">
    <div class="mascot-greeting-cloud" id="mascot-greeting-cloud">Hi, I am Mohammed</div>
  </div>

  <!-- ════════ FOOTER STATUS BAR ════════ -->
  <footer class="footer-bar">
    <div class="footer-spacer"></div>
  </footer>

  <!-- ════════ JAVASCRIPT ════════ -->
  <script>
    // ── Keyboard-controlled Walking Sprite ───────────────────────
    (function initWalkingMascot() {
      const mascot = document.getElementById("login-mascot");
      const sprite = document.getElementById("login-mascot-sprite");
      if (!mascot || !sprite || mascot.dataset.spriteInitialized) return;
      mascot.dataset.spriteInitialized = "true";

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const frames = [
        ["0%", "0%"], ["33.3333%", "0%"], ["66.6667%", "0%"], ["100%", "0%"],
        ["0%", "50%"], ["33.3333%", "50%"], ["66.6667%", "50%"], ["100%", "50%"],
        ["0%", "100%"], ["33.3333%", "100%"], ["66.6667%", "100%"], ["100%", "100%"]
      ];
      const weights = [1.25, 1.15, .85, .8, .9, 1.05, 1.25, 1.15, .85, .8, .9, 1.05];
      const keys = { ArrowLeft: false, ArrowRight: false };
      let animationFrame = null;
      let direction = 1;
      let x = 0;
      let minX = 24;
      let maxX = 24;
      let pixelsPerFrame = 8;
      let speed = 60;
      let gaitPhase = 0;
      let lastNow = 0;
      let needsMeasure = true;
      let greetingUntil = 0;

      function chooseSpeed() {
        speed = reducedMotion.matches ? 42 : (window.innerWidth <= 600 ? 52 : 62);
      }

      function measureCorridor() {
        const padding = window.innerWidth <= 600 ? 14 : 24;
        const width = mascot.offsetWidth;
        minX = padding;
        maxX = Math.max(minX, window.innerWidth - padding - width);
        const cycles = Math.max(1, Math.round((maxX - minX) / (width * .98)));
        pixelsPerFrame = Math.max(1, (maxX - minX) / (cycles * 12));
        x = Math.max(minX, Math.min(maxX, lastNow === 0 ? maxX : x));
        needsMeasure = false;
        mascot.style.transform = `translate3d(${x.toFixed(2)}px, 0, 0)`;
        mascot.dataset.corridor = `${minX},${maxX}`;
      }

      function isEditable(target) {
        return target instanceof Element && Boolean(target.closest("input, textarea, select, [contenteditable]:not([contenteditable='false'])"));
      }

      function stop() {
        gaitPhase = 0;
        mascot.dataset.visual = "front";
        mascot.dataset.spriteState = "IDLE_FRONT";
        mascot.dataset.spriteSpeed = "0.00";
        mascot.dataset.spriteFps = "0.00";
      }

      function onKeyDown(event) {
        if (!(event.key in keys) || isEditable(event.target)) return;
        event.preventDefault();
        keys[event.key] = true;
      }

      function onKeyUp(event) {
        if (!(event.key in keys)) return;
        if (!isEditable(event.target)) event.preventDefault();
        keys[event.key] = false;
        stop();
      }

      function releaseKeys() {
        keys.ArrowLeft = false;
        keys.ArrowRight = false;
        stop();
      }

      function beginGreeting() {
        greetingUntil = Date.now() + 2000;
        mascot.dataset.greeting = "true";
        mascot.dataset.cloudAlign = x < minX + 130 ? "left" : (x > maxX - 130 ? "right" : "center");
        releaseKeys();
      }

      function render(now) {
        if (needsMeasure) measureCorridor();
        if (!lastNow) lastNow = now;
        const elapsed = Math.min(.05, Math.max(0, (now - lastNow) / 1000));
        lastNow = now;
        const greeting = Date.now() < greetingUntil;
        if (!greeting && mascot.dataset.greeting === "true") mascot.dataset.greeting = "false";

        const requestedDirection = keys.ArrowLeft === keys.ArrowRight ? 0 : (keys.ArrowLeft ? -1 : 1);
        const atBoundary = (requestedDirection < 0 && x <= minX) || (requestedDirection > 0 && x >= maxX);
        const walking = !greeting && requestedDirection !== 0 && !atBoundary;
        if (walking) {
          direction = requestedDirection;
          const previousX = x;
          x = Math.max(minX, Math.min(maxX, x + direction * speed * elapsed));
          const travelled = Math.abs(x - previousX);
          gaitPhase = (gaitPhase + travelled / pixelsPerFrame) % 12;
          let frame = 0;
          let phase = gaitPhase;
          while (frame < 11 && phase >= weights[frame]) phase -= weights[frame++];
          sprite.style.backgroundPosition = `${frames[frame][0]} ${frames[frame][1]}`;
          sprite.style.transform = `scaleX(${direction})`;
          mascot.dataset.visual = "walk";
          mascot.dataset.spriteFrame = String(frame);
          mascot.dataset.spriteState = direction < 0 ? "WALK_LEFT" : "WALK_RIGHT";
          mascot.dataset.spriteDirection = direction < 0 ? "left" : "right";
          mascot.dataset.spriteSpeed = speed.toFixed(2);
          mascot.dataset.spriteFps = (speed / pixelsPerFrame).toFixed(2);
        } else {
          stop();
        }
        mascot.style.transform = `translate3d(${x.toFixed(2)}px, 0, 0)`;
        animationFrame = requestAnimationFrame(render);
      }

      function requestMeasure() { needsMeasure = true; }
      function changeMotion() { chooseSpeed(); }

      chooseSpeed();
      measureCorridor();
      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("keyup", onKeyUp);
      window.addEventListener("blur", releaseKeys);
      window.addEventListener("resize", requestMeasure, { passive: true });
      reducedMotion.addEventListener("change", changeMotion);
      mascot.addEventListener("click", beginGreeting);
      animationFrame = requestAnimationFrame(render);

      window.addEventListener("pagehide", () => {
        if (animationFrame !== null) cancelAnimationFrame(animationFrame);
        window.removeEventListener("keydown", onKeyDown);
        window.removeEventListener("keyup", onKeyUp);
        window.removeEventListener("blur", releaseKeys);
        window.removeEventListener("resize", requestMeasure);
        reducedMotion.removeEventListener("change", changeMotion);
        mascot.removeEventListener("click", beginGreeting);
      }, { once: true });
    })();

    // ── Theme Toggle ─────────────────────────────────────────────
    (function initTheme() {
      const saved = localStorage.getItem("qa-theme") || "dark";
      document.documentElement.setAttribute("data-theme", saved);
      document.getElementById("theme-icon").textContent = saved === "dark" ? "☀️" : "🌙";
    })();

    document.getElementById("theme-toggle").addEventListener("click", () => {
      const html = document.documentElement;
      const current = html.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      html.setAttribute("data-theme", next);
      localStorage.setItem("qa-theme", next);
      document.getElementById("theme-icon").textContent = next === "dark" ? "☀️" : "🌙";
    });

    function switchTab(role) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(role + '-tab').classList.add('active');
        
        const usernameInput = document.querySelector('input[name="username"]');
        document.getElementById('role-hidden-input').value = role;
        
        if (role === 'admin') {
            if (usernameInput) usernameInput.placeholder = 'Admin Username';
        } else {
            if (usernameInput) usernameInput.placeholder = 'Username or Email';
        }
    }

    // Attach event listeners to tabs
    document.getElementById('user-tab').addEventListener('click', () => switchTab('user'));
    document.getElementById('admin-tab').addEventListener('click', () => switchTab('admin'));

    // ── Basic client-side validation before submit ────────────────
    document.getElementById("login-form").addEventListener("submit", (e) => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const errEl    = document.getElementById("login-error");
      const errText  = document.getElementById("login-error-text");

      if (!username || !password) {
        e.preventDefault();
        errText.textContent = "Please enter both username and password.";
        errEl.classList.add("visible");
        return;
      }

      errEl.classList.remove("visible");
    });
  </script>
</body>
