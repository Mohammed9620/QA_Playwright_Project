<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — QA Automation Engine</title>
  <meta name="description" content="Sign in to the QA Automation Engine dashboard.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <style>
    /* ════════════════════════════════════════════════════════════
       LOGIN — Page-specific styles
       ════════════════════════════════════════════════════════════ */

    /* ── Smoke Background ── */
    html,
    body {
      background: transparent !important;
    }

    #smoke-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    /* ── Card Layout ── */
    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
    }

    /* ── Brand mark above card ── */
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
      text-align: center;
    }

    .login-brand-icon {
      width: 40px;
      height: 40px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-blue);
    }

    .login-brand-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .login-brand-sub {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* ── Card surface (glassmorphism with dynamic ambient shadow) ── */
    .login-surface {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow:
        0 20px 50px -10px rgba(0, 0, 0, 0.75),
        var(--dyn-shadow-x, 0px) var(--dyn-shadow-y, 16px) 38px rgba(0, 0, 0, 0.60),
        var(--dyn-glow-x, 0px) var(--dyn-glow-y, 0px) 70px rgba(59, 10, 87, 0.45);
      will-change: box-shadow;
    }

    /* ── Section header inside card ── */
    .login-section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 20px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-default);
    }

    /* ── Segmented Tab Controls ── */
    .tabs-container {
      position: relative;
      display: flex;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 24px;
      justify-content: center;
    }

    .tab-indicator {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 0;
      background: var(--accent-blue);
      border-radius: calc(var(--radius-md) - 4px);
      transition: transform var(--duration-normal) var(--ease-out),
        width var(--duration-normal) var(--ease-out);
      z-index: 1;
      pointer-events: none;
    }

    .tab-btn {
      flex: 1;
      position: relative;
      z-index: 2;
      padding: 10px 20px;
      border: none;
      background-color: transparent !important;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: calc(var(--radius-md) - 4px);
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font);
      transition: color var(--duration-normal) var(--ease-out),
        transform var(--duration-fast) var(--ease-out);
    }

    .tab-btn:hover:not(.active) {
      color: var(--text-primary);
    }

    .tab-btn.active {
      color: #ffffff !important;
      font-weight: 600;
    }

    /* P2.1: scale feedback */
    .tab-btn:active {
      transform: scale(0.97);
    }

    .tab-btn:focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 2px;
    }

    /* ── Form group (login-specific inputs) ── */
    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group input {
      padding: 12px;
      border: 1px solid var(--border-default);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      border-radius: 6px;
      width: 100%;
      font-size: 14px;
      font-family: var(--font);
      outline: none;
      /* P2.2: smooth focus transition */
      transition: border-color var(--duration-fast) var(--ease-out),
        box-shadow var(--duration-fast) var(--ease-out);
    }

    .form-group input::placeholder {
      color: var(--text-tertiary);
    }

    .form-group input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px rgba(155, 106, 196, 0.18);
    }

    .form-group label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
    }

    /* ── Error banner: client-toggled (starts hidden) ── */
    .error-banner {
      display: none;
      animation: none;
    }

    .error-banner.visible {
      display: flex;
      animation: banner-enter var(--duration-normal) var(--ease-out);
    }

    /* ── Submit button ── */
    .btn-login {
      width: 100%;
      margin-top: 24px;
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: var(--accent-blue);
      color: #ffffff;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: filter var(--duration-fast) var(--ease-out),
        transform var(--duration-fast) var(--ease-out);
    }

    .btn-login:hover {
      filter: brightness(1.12);
    }

    /* P2.1: scale feedback */
    .btn-login:active {
      transform: scale(0.97);
    }

    .btn-login:focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 2px;
    }

    .btn-login:disabled {
      cursor: not-allowed;
      opacity: 0.58;
      filter: saturate(0.72);
    }

    /* ── Back link ── */
    .login-back {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .login-back a {
      color: var(--accent-blue);
      text-decoration: none;
      transition: color var(--duration-fast) var(--ease-out),
        opacity var(--duration-fast) var(--ease-out);
    }

    .login-back a:hover {
      text-decoration: underline;
    }

    .login-back a:active {
      opacity: 0.72;
    }

    /* ════════════════════════════════════════════════════════════
       MASCOT  (personality element — unchanged)
       ════════════════════════════════════════════════════════════ */
    /* Outer translates in viewport coordinates; inner owns sprite direction. */
    .login-mascot {
      position: fixed;
      left: 0;
      bottom: 28px;
      width: 100px;
      height: 100px;
      display: block;
      pointer-events: none;
      user-select: none;
      z-index: 2;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }

    .login-mascot-sprite,
    .login-mascot-front {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .login-mascot-sprite {
      overflow: hidden;
      transform-origin: center bottom;
      will-change: transform;
      background-image: url("{{ url_for('static', filename='images/login-mascot-walk-v2-normalized.png') }}");
      background-repeat: no-repeat;
      background-size: 400% 300%;
      background-position: 0 0;
      image-rendering: pixelated;
    }

    .login-mascot-front {
      display: block;
      object-fit: contain;
      object-position: center bottom;
      visibility: hidden;
      image-rendering: pixelated;
    }

    .login-mascot[data-visual="front"] .login-mascot-sprite {
      visibility: hidden;
    }

    .login-mascot[data-visual="front"] .login-mascot-front {
      visibility: visible;
    }

    .mascot-greeting-cloud {
      position: absolute;
      left: 50%;
      bottom: calc(100% - 8px);
      width: max-content;
      max-width: 150px;
      padding: 8px 12px;
      border: 1px solid var(--border-default);
      border-radius: 18px 20px 16px 21px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.35;
      text-align: center;
      white-space: nowrap;
      opacity: 0;
      transform: translateX(-50%) scale(0.94);
      transition: opacity 140ms var(--ease-out), transform 160ms var(--ease-out);
      pointer-events: none;
    }

    .mascot-greeting-cloud::before,
    .mascot-greeting-cloud::after {
      content: "";
      position: absolute;
      z-index: -1;
      border: 1px solid var(--border-default);
      border-radius: 50%;
      background: var(--bg-secondary);
    }

    .mascot-greeting-cloud::before {
      width: 16px;
      height: 16px;
      left: 15px;
      top: -6px;
    }

    .mascot-greeting-cloud::after {
      width: 21px;
      height: 21px;
      right: 18px;
      top: -8px;
    }

    .login-mascot[data-greeting="true"] .mascot-greeting-cloud {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .login-mascot[data-cloud-align="left"] .mascot-greeting-cloud {
      left: 0;
      transform: scale(0.94);
    }

    .login-mascot[data-cloud-align="right"] .mascot-greeting-cloud {
      right: 0;
      left: auto;
      transform: scale(0.94);
    }

    .login-mascot[data-greeting="true"][data-cloud-align="left"] .mascot-greeting-cloud,
    .login-mascot[data-greeting="true"][data-cloud-align="right"] .mascot-greeting-cloud {
      transform: scale(1);
    }

    @media (hover: hover) and (pointer: fine) {
      .login-mascot {
        pointer-events: auto;
      }
    }

    @media (max-width: 600px) {
      .login-mascot {
        width: 76px;
        height: 76px;
      }
    }

    @media (max-width: 340px),
    (max-height: 620px) {
      .login-mascot {
        display: none;
      }
    }

    /* ── Entrance Animations ── */
    .topbar {
      animation: fade-in var(--duration-slow) var(--ease-out) both;
    }

    .login-brand {
      animation: fade-in var(--duration-slow) var(--ease-out) 60ms both;
    }

    .login-surface {
      animation: fade-in var(--duration-slow) var(--ease-out) 120ms both;
    }

    .tabs-container {
      animation: fade-in var(--duration-slow) var(--ease-out) 180ms both;
    }

    #form-section-title {
      animation: fade-in var(--duration-slow) var(--ease-out) 220ms both;
    }

    .form-group:nth-of-type(1) {
      animation: fade-in var(--duration-slow) var(--ease-out) 260ms both;
    }

    .form-group:nth-of-type(2) {
      animation: fade-in var(--duration-slow) var(--ease-out) 300ms both;
    }

    .btn-login {
      animation: fade-in var(--duration-slow) var(--ease-out) 340ms both;
    }

    .login-back {
      animation: fade-in var(--duration-slow) var(--ease-out) 400ms both;
    }

    /* ── Reduced motion (page-specific) ── */
    @media (prefers-reduced-motion: reduce) {

      .topbar,
      .login-brand,
      .login-surface,
      .tabs-container,
      #form-section-title,
      .form-group,
      .btn-login,
      .login-back {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }

      .tab-btn,
      .btn-login,
      .tab-indicator {
        transition-duration: var(--duration-fast);
      }

      .tab-btn:active,
      .btn-login:active {
        transform: none;
        filter: brightness(0.94);
      }

      .mascot-greeting-cloud {
        transition-duration: 100ms;
      }
    }
  </style>
</head>

<body>
  <!-- ════════ SMOKE BACKGROUND ════════ -->
  <canvas id="smoke-bg"></canvas>

  <!-- ════════ TOP BAR ════════ -->
  <header class="topbar">
    <a class="topbar-brand" href="/">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        <path d="M9 12l2 2 4-4" />
      </svg>
      QA Automation Engine
    </a>
    <span class="topbar-version">v1.0</span>
    <div class="topbar-spacer"></div>
    <button class="theme-toggle" id="theme-toggle" title="Toggle theme" aria-label="Toggle dark/light theme">
      <span id="theme-icon">☀️</span>
    </button>
  </header>

  <!-- ════════ LOGIN CARD ════════ -->
  <main class="login-wrapper">
    <div class="login-card">

      <!-- Brand mark -->
      <div class="login-brand">
        <div class="login-brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0110 0v4" />
          </svg>
        </div>
        <h1 class="login-brand-title">Sign in</h1>
        <span class="login-brand-sub">Access the QA Automation Engine</span>
      </div>

      <!-- Card surface -->
      <div class="login-surface"
        style="background:rgba(255, 255, 255, 0.08)!important;backdrop-filter:blur(20px)!important;-webkit-backdrop-filter:blur(20px)!important;border:1px solid rgba(255,255,255,0.16)!important;border-radius:16px!important;box-shadow: 0 20px 50px -10px rgba(0,0,0,0.75), var(--dyn-shadow-x, 0px) var(--dyn-shadow-y, 16px) 38px rgba(0,0,0,0.60), var(--dyn-glow-x, 0px) var(--dyn-glow-y, 0px) 70px rgba(59,10,87,0.45)!important;">
        <!-- Role Tabs -->
        <div class="tabs-container">
          <div class="tab-indicator" id="tab-indicator"></div>
          <button type="button" class="tab-btn active" id="user-tab">Login as User</button>
          <button type="button" class="tab-btn" id="admin-tab">Login as Admin</button>
        </div>

        <h2 class="login-section-title" id="form-section-title">Credentials</h2>

        <!-- Error banner: shown by server on bad credentials OR by JS for empty fields -->
        {% if error %}
        <div class="error-banner visible" id="login-error" role="alert">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span id="login-error-text">{{ error }}</span>
        </div>
        {% else %}
        <div class="error-banner" id="login-error" role="alert">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span id="login-error-text">Invalid username or password.</span>
        </div>
        {% endif %}

        <form id="login-form" method="POST" action="/login" novalidate>
          <input type="hidden" name="role" id="role-hidden-input" value="user">

          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Username or Email" autocomplete="username"
              spellcheck="false" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password"
              required>
          </div>

          <button type="submit" class="btn-login" id="login-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4" />
              <polyline points="10 17 15 12 10 7" />
              <line x1="15" y1="12" x2="3" y2="12" />
            </svg>
            Sign in
          </button>
        </form>
      </div>

      <p class="login-back">
        Don't have an account? <a href="/signup">Sign up</a>
      </p>
    </div>
  </main>

  <div class="login-mascot" id="login-mascot" aria-hidden="true" data-greeting="false" data-visual="front">
    <div class="login-mascot-sprite" id="login-mascot-sprite"></div>
    <img class="login-mascot-front" id="login-mascot-front"
      src="{{ url_for('static', filename='images/login-mascot.png') }}" alt="">
    <div class="mascot-greeting-cloud" id="mascot-greeting-cloud">Hi, I am Mohammed</div>
  </div>



  <!-- ════════ JAVASCRIPT ════════ -->
  <script>
    // ── Keyboard-controlled Walking Sprite ───────────────────────
    (function initWalkingMascot() {
      const mascot = document.getElementById("login-mascot");
      const sprite = document.getElementById("login-mascot-sprite");
      if (!mascot || !sprite || mascot.dataset.spriteInitialized) return;
      mascot.dataset.spriteInitialized = "true";

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const frames = [
        ["0%", "0%"], ["33.3333%", "0%"], ["66.6667%", "0%"], ["100%", "0%"],
        ["0%", "50%"], ["33.3333%", "50%"], ["66.6667%", "50%"], ["100%", "50%"],
        ["0%", "100%"], ["33.3333%", "100%"], ["66.6667%", "100%"], ["100%", "100%"]
      ];
      const weights = [1.25, 1.15, .85, .8, .9, 1.05, 1.25, 1.15, .85, .8, .9, 1.05];
      const keys = { ArrowLeft: false, ArrowRight: false };
      let animationFrame = null;
      let direction = 1;
      let x = 0;
      let minX = 24;
      let maxX = 24;
      let pixelsPerFrame = 8;
      let speed = 60;
      let gaitPhase = 0;
      let lastNow = 0;
      let needsMeasure = true;
      let greetingUntil = 0;

      function chooseSpeed() {
        speed = reducedMotion.matches ? 42 : (window.innerWidth <= 600 ? 52 : 62);
      }

      function measureCorridor() {
        const padding = window.innerWidth <= 600 ? 14 : 24;
        const width = mascot.offsetWidth;
        minX = padding;
        maxX = Math.max(minX, window.innerWidth - padding - width);
        const cycles = Math.max(1, Math.round((maxX - minX) / (width * .98)));
        pixelsPerFrame = Math.max(1, (maxX - minX) / (cycles * 12));
        x = Math.max(minX, Math.min(maxX, lastNow === 0 ? maxX : x));
        needsMeasure = false;
        mascot.style.transform = `translate3d(${x.toFixed(2)}px, 0, 0)`;
        mascot.dataset.corridor = `${minX},${maxX}`;
      }

      function isEditable(target) {
        return target instanceof Element && Boolean(target.closest("input, textarea, select, [contenteditable]:not([contenteditable='false'])"));
      }

      function stop() {
        gaitPhase = 0;
        mascot.dataset.visual = "front";
        mascot.dataset.spriteState = "IDLE_FRONT";
        mascot.dataset.spriteSpeed = "0.00";
        mascot.dataset.spriteFps = "0.00";
      }

      function onKeyDown(event) {
        if (!(event.key in keys) || isEditable(event.target)) return;
        event.preventDefault();
        keys[event.key] = true;
      }

      function onKeyUp(event) {
        if (!(event.key in keys)) return;
        if (!isEditable(event.target)) event.preventDefault();
        keys[event.key] = false;
        stop();
      }

      function releaseKeys() {
        keys.ArrowLeft = false;
        keys.ArrowRight = false;
        stop();
      }

      function beginGreeting() {
        greetingUntil = Date.now() + 2000;
        mascot.dataset.greeting = "true";
        mascot.dataset.cloudAlign = x < minX + 130 ? "left" : (x > maxX - 130 ? "right" : "center");
        releaseKeys();
      }

      function render(now) {
        if (needsMeasure) measureCorridor();
        if (!lastNow) lastNow = now;
        const elapsed = Math.min(.05, Math.max(0, (now - lastNow) / 1000));
        lastNow = now;
        const greeting = Date.now() < greetingUntil;
        if (!greeting && mascot.dataset.greeting === "true") mascot.dataset.greeting = "false";

        const requestedDirection = keys.ArrowLeft === keys.ArrowRight ? 0 : (keys.ArrowLeft ? -1 : 1);
        const atBoundary = (requestedDirection < 0 && x <= minX) || (requestedDirection > 0 && x >= maxX);
        const walking = !greeting && requestedDirection !== 0 && !atBoundary;
        if (walking) {
          direction = requestedDirection;
          const previousX = x;
          x = Math.max(minX, Math.min(maxX, x + direction * speed * elapsed));
          const travelled = Math.abs(x - previousX);
          gaitPhase = (gaitPhase + travelled / pixelsPerFrame) % 12;
          let frame = 0;
          let phase = gaitPhase;
          while (frame < 11 && phase >= weights[frame]) phase -= weights[frame++];
          sprite.style.backgroundPosition = `${frames[frame][0]} ${frames[frame][1]}`;
          sprite.style.transform = `scaleX(${direction})`;
          mascot.dataset.visual = "walk";
          mascot.dataset.spriteFrame = String(frame);
          mascot.dataset.spriteState = direction < 0 ? "WALK_LEFT" : "WALK_RIGHT";
          mascot.dataset.spriteDirection = direction < 0 ? "left" : "right";
          mascot.dataset.spriteSpeed = speed.toFixed(2);
          mascot.dataset.spriteFps = (speed / pixelsPerFrame).toFixed(2);
        } else {
          stop();
        }
        mascot.style.transform = `translate3d(${x.toFixed(2)}px, 0, 0)`;
        animationFrame = requestAnimationFrame(render);
      }

      function requestMeasure() { needsMeasure = true; }
      function changeMotion() { chooseSpeed(); }

      chooseSpeed();
      measureCorridor();
      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("keyup", onKeyUp);
      window.addEventListener("blur", releaseKeys);
      window.addEventListener("resize", requestMeasure, { passive: true });
      reducedMotion.addEventListener("change", changeMotion);
      mascot.addEventListener("click", beginGreeting);
      animationFrame = requestAnimationFrame(render);

      window.addEventListener("pagehide", () => {
        if (animationFrame !== null) cancelAnimationFrame(animationFrame);
        window.removeEventListener("keydown", onKeyDown);
        window.removeEventListener("keyup", onKeyUp);
        window.removeEventListener("blur", releaseKeys);
        window.removeEventListener("resize", requestMeasure);
        reducedMotion.removeEventListener("change", changeMotion);
        mascot.removeEventListener("click", beginGreeting);
      }, { once: true });
    })();

    // ── Theme Toggle ─────────────────────────────────────────────
    (function initTheme() {
      const saved = localStorage.getItem("qa-theme") || "dark";
      document.documentElement.setAttribute("data-theme", saved);
      document.getElementById("theme-icon").textContent = saved === "dark" ? "☀️" : "🌙";
    })();

    document.getElementById("theme-toggle").addEventListener("click", () => {
      const html = document.documentElement;
      const current = html.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      html.setAttribute("data-theme", next);
      localStorage.setItem("qa-theme", next);
      document.getElementById("theme-icon").textContent = next === "dark" ? "☀️" : "🌙";
    });

    function switchTab(role) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(role + '-tab');
      if (activeBtn) {
        activeBtn.classList.add('active');

        const indicator = document.getElementById('tab-indicator');
        if (indicator) {
          indicator.style.transform = `translateX(${activeBtn.offsetLeft}px)`;
          indicator.style.width = `${activeBtn.offsetWidth}px`;
        }
      }

      const usernameInput = document.querySelector('input[name="username"]');
      document.getElementById('role-hidden-input').value = role;

      if (role === 'admin') {
        if (usernameInput) usernameInput.placeholder = 'Admin Username';
      } else {
        if (usernameInput) usernameInput.placeholder = 'Username or Email';
      }
    }

    // Ensure the indicator is positioned correctly on load and resize
    window.addEventListener('load', () => {
      const activeRole = document.getElementById('role-hidden-input').value || 'user';
      switchTab(activeRole);
    });
    window.addEventListener('resize', () => {
      const activeRole = document.getElementById('role-hidden-input').value || 'user';
      switchTab(activeRole);
    });

    // Attach event listeners to tabs
    document.getElementById('user-tab').addEventListener('click', () => switchTab('user'));
    document.getElementById('admin-tab').addEventListener('click', () => switchTab('admin'));

    // ── Basic client-side validation before submit ────────────────
    document.getElementById("login-form").addEventListener("submit", (e) => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const errEl = document.getElementById("login-error");
      const errText = document.getElementById("login-error-text");

      if (!username || !password) {
        e.preventDefault();
        errText.textContent = "Please enter both username and password.";
        errEl.classList.add("visible");
        return;
      }

      errEl.classList.remove("visible");
    });
  </script>

  <!-- ════════ WEBGL SMOKE SHADER ════════ -->
  <script>
    (function initSmokeBackground() {
      var canvas = document.getElementById('smoke-bg');
      if (!canvas) return;

      var gl = canvas.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false })
        || canvas.getContext('experimental-webgl', { alpha: false });
      if (!gl) {
        canvas.style.background = 'radial-gradient(ellipse at 50% 40%, #2a0010 0%, #0a0004 100%)';
        return;
      }

      /* ── Canvas resize via ResizeObserver ── */
      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var w = canvas.clientWidth * dpr;
        var h = canvas.clientHeight * dpr;
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
          gl.viewport(0, 0, w, h);
        }
      }
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(resize).observe(canvas);
      } else {
        window.addEventListener('resize', resize, { passive: true });
      }
      resize();

      /* ── Shaders ── */
      var VERT = 'attribute vec2 a_pos; void main(){ gl_Position=vec4(a_pos,0.0,1.0); }';

      var FRAG = [
        'precision mediump float;',
        'uniform vec2 iResolution;',
        'uniform float iTime;',
        'uniform vec3 u_color;',
        '',
        'void mainImage(out vec4 fragColor, in vec2 fragCoord){',
        '    vec2 centeredUV = (2.0 * fragCoord - iResolution.xy) / min(iResolution.x, iResolution.y);',
        '    float time = iTime * 0.14;',
        '',
        '    // Autonomous smoke distortion loop (100% time-driven, no mouse interaction)',
        '    vec2 distortion = centeredUV;',
        '    for (int j = 1; j < 8; j++) {',
        '        float i = float(j);',
        '        distortion.x += 0.5 / i * cos(i * 2.0 * distortion.y + time);',
        '        distortion.y += 0.5 / i * cos(i * 2.0 * distortion.x + time);',
        '    }',
        '',
        '    // Create a glowing wave pattern',
        '    float wave = abs(sin(distortion.x + distortion.y + time));',
        '    float glow = smoothstep(0.9, 0.2, wave);',
        '',
        '    fragColor = vec4(u_color * glow, 1.0);',
        '}',
        '',
        'void main() {',
        '    mainImage(gl_FragColor, gl_FragCoord.xy);',
        '}'
      ].join('\n');

      /* ── Compile helper ── */
      function compile(type, src) {
        var s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
          console.error('Smoke shader compile error:', gl.getShaderInfoLog(s));
          gl.deleteShader(s);
          return null;
        }
        return s;
      }

      var vs = compile(gl.VERTEX_SHADER, VERT);
      var fs = compile(gl.FRAGMENT_SHADER, FRAG);
      if (!vs || !fs) {
        canvas.style.background = 'radial-gradient(ellipse at 50% 40%, #3B0A57 0%, #08010d 100%)';
        return;
      }

      var prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        console.error('Smoke program link error:', gl.getProgramInfoLog(prog));
        canvas.style.background = 'radial-gradient(ellipse at 50% 40%, #3B0A57 0%, #08010d 100%)';
        return;
      }
      gl.useProgram(prog);

      /* ── Fullscreen quad ── */
      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      var aPos = gl.getAttribLocation(prog, 'a_pos');
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

      /* ── Uniforms ── */
      var uResolution = gl.getUniformLocation(prog, 'iResolution');
      var uTime       = gl.getUniformLocation(prog, 'iTime');
      var uColor      = gl.getUniformLocation(prog, 'u_color');

      var t0 = performance.now();
      var raf;

      var surfaceEl = document.querySelector('.login-surface');

      /* ── Render loop (Autonomous, continuous moving shadows and smoke) ── */
      function frame() {
        var elapsed = (performance.now() - t0) / 1000.0;

        /* Dynamic moving shadows: autonomous continuous breathing & orbital drift (no mouse dependency) */
        var sx = (Math.sin(elapsed * 0.2) * 12.0).toFixed(1);
        var sy = (Math.cos(elapsed * 0.14) * 14.0 + 16.0).toFixed(1);
        var gx = (Math.sin(elapsed * 0.25) * 15.0).toFixed(1);
        var gy = (Math.cos(elapsed * 0.22) * 16.0).toFixed(1);

        if (surfaceEl) {
          surfaceEl.style.setProperty('--dyn-shadow-x', sx + 'px');
          surfaceEl.style.setProperty('--dyn-shadow-y', sy + 'px');
          surfaceEl.style.setProperty('--dyn-glow-x', gx + 'px');
          surfaceEl.style.setProperty('--dyn-glow-y', gy + 'px');
        }

        gl.uniform2f(uResolution, canvas.width, canvas.height);
        gl.uniform1f(uTime, elapsed);
        // #3B0A57 in normalized RGB: [59/255, 10/255, 87/255]
        gl.uniform3f(uColor, 59.0 / 255.0, 10.0 / 255.0, 87.0 / 255.0);

        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        raf = requestAnimationFrame(frame);
      }
      raf = requestAnimationFrame(frame);

      window.addEventListener('pagehide', function () {
        cancelAnimationFrame(raf);
      }, { once: true });
    })();
  </script>
