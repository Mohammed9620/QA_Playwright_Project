[pytest]
# Directory containing test files
testpaths = tests

# Python search path
pythonpath = .

# Default command line options
addopts = -v -s --strict-markers

# Custom test markers documentation and registration
markers =
    ui: UI End-to-End browser tests powered by Playwright
    api: REST API availability and contract tests
    auth: Authentication, session management, and authorization flows
    negative: Negative path testing and client validation handling
    security: Penetration probes, weak credentials, and cookie flag security checks
    performance: Latency, load response, and SLA compliance checks
    slow: Long-running or intensive dictionary brute force suites
